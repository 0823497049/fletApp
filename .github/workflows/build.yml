name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet
      - name: Build APK
        run: flet build apk --yes --no-rich-output
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastSaver-APK
          path: build/apk
