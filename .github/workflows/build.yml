name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils libmpv-dev mpv

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet

      - name: Accept Android licenses
        run: |
          FLUTTER_BIN="/home/runner/flutter/3.44.8/bin/flutter"
          if [ -f "$FLUTTER_BIN" ]; then
            yes | $FLUTTER_BIN doctor --android-licenses || true
          fi
          # Also try with sdkmanager
          yes | sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          flet build apk --verbose --no-rich-output

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
