name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils libmpv-dev mpv
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet
      - name: Accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Clean
        run: |
          rm -rf build
      - name: Build APK
        run: |
          flet build apk --yes --no-rich-output --verbose 2>&1 | tail -n 300
