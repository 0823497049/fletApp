name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flet==0.27.6
      - run: flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
