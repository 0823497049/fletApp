name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev mesa-utils libmpv-dev mpv
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build APK (show gradle error)
        run: flet build apk --yes --verbose 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Show log on failure
        if: failure()
        run: cat build.log | tail -n 300
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FastSaver-APK
          path: build/apk
